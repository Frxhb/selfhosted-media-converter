<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a2333" />
    </linearGradient>
    
    <!-- Text and Icon Gradients -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Background Pattern (Dot Grid) -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06" />
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Glowing Abstract Orbs -->
  <circle cx="950" cy="100" r="150" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="150" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />
  <circle cx="150" cy="350" r="200" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- UI Mockup / Graphic on the Right -->
  <g transform="translate(730, 70)">
    <!-- App Window Frame -->
    <rect x="0" y="0" width="400" height="260" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.95" />
    
    <!-- Traffic Lights (macOS style window dots) -->
    <circle cx="25" cy="24" r="6" fill="#ef4444" />
    <circle cx="45" cy="24" r="6" fill="#eab308" />
    <circle cx="65" cy="24" r="6" fill="#22c55e" />
    
    <!-- Window Header Divider -->
    <line x1="0" y1="48" x2="400" y2="48" stroke="#334155" stroke-width="2" />

    <!-- File Graphic - Video Input -->
    <rect x="30" y="80" width="130" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <polygon points="85,105 105,115 85,125" fill="#60a5fa" />
    <text x="95" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">input.mkv (4K)</text>

    <!-- Arrow / Processing Indicator -->
    <path d="M 170 115 L 215 115" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
    <polygon points="215,107 227,115 215,123" fill="#a78bfa" />

    <!-- File Graphic - Compressed Output -->
    <rect x="240" y="80" width="130" height="70" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <polygon points="295,105 315,115 295,125" fill="#8b5cf6" />
    <text x="305" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">output.mp4 (1080p)</text>

    <!-- Progress Bar -->
    <rect x="30" y="210" width="340" height="12" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="30" y="210" width="250" height="12" rx="6" fill="url(#iconGradient)" />
    <text x="30" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">73%</text>
    <text x="70" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Converting (FFmpeg HWAccel)</text>
  </g>

  <!-- Left Side Typography -->
  <g transform="translate(80, 130)">
    <!-- App Icon Placeholder -->
    <g transform="translate(0, -70)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#iconGradient)" />
      <!-- Refresh / Convert Icon vector -->
      <path d="M 18 23 A 10 10 0 0 1 38 23 M 38 23 L 33 18 M 38 23 L 33 28 M 38 33 A 10 10 0 0 1 18 33 M 18 33 L 23 28 M 18 33 L 23 38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Main Title -->
    <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Selfhosted
    </text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#textGradient)" letter-spacing="-1">
      Media Converter
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Fast, private, and secure media processing
    </text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      directly on your own server.
    </text>
    
    <!-- Feature Tags -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text x="52.5" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Open Source</text>
      
      <!-- Tag 2 -->
      <rect x="115" y="0" width="115" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text x="172.5" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Self-Hosted</text>

      <!-- Tag 3 -->
      <rect x="240" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text x="307.5" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Privacy-Focused</text>
    </g>
  </g>
</svg>
